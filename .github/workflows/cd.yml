name:  Continuous Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Build do Projeto
        run: npm run build

      - name: Deploy
        run: |
          test -f dist/manifest.json || (echo "manifest.json não encontrado na dist" && exit 1)
          test -f dist/src/sidepanel/sidepanel.html || (echo "sidepanel.html não encontrado na dist" && exit 1)

      # Compactação em ZIP
      - name: Compactar extensão em ZIP
        run: | 
          cd dist
          zip -r ../zuri-extension.zip *
          cd ..
          echo "Extensão compactada: zuri-extension.zip"

      - name: Upload do artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: zuri-extension-artifact
          path: zuri-extension.zip